[project]
name = "pysparkdt"
version = "0.0.0"  # Do not modify this, it is managed by CI
description = "An open-source Python library for simplifying local testing of Databricks workflows that use PySpark and Delta tables."
readme = "README.md"
requires-python = ">=3.10, <3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juraj Pall", email = "juraj.pall@datamole.ai" }]
dependencies = [
    "pyspark[sql]>=3.5.0,!=3.5.6,!=3.5.7,!=3.5.8,!=3.5.9,!=3.5.10,!=3.5.11,<4.1.0",  # 3.5.6+ https://github.com/delta-io/delta/issues/4671 not solved for at least 3.5.6 - 3.5.8, we must use != to exclude versions as there is no conditional operator supported in pypi
    "delta-spark>=3.0.0,<4.1.0",
    "numpy>=1.26.0",
    "pandas<3.0.0",  # PySpark 4.0.x not compatible with Pandas 3.0.x (30.1.2026) + Python 3.10 not compatible with Pandas 3
    "setuptools>=75.6.0,<76; python_version >= '3.12'",  # Necessary for Python 3.12+ as distutils is missing without it
]

[project.urls]
Homepage = "https://github.com/datamole-ai/pysparkdt"
Repository = "https://github.com/datamole-ai/pysparkdt"
Issues = "https://github.com/datamole-ai/pysparkdt/issues"

[dependency-groups]
dev = [
    "ruff>=0.14.14,<0.15.0",
    "pytest>=9.0.2,<10.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pysparkdt"]

[tool.hatch.build.targets.sdist]
include = [
    "pysparkdt",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 79
target-version = "py310"
lint.select = [
    "E",
    "F",
    "N",
    "W",
    "I001",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"*/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["example"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.10.0"
exclude-newer = "14 days"
