name: Dynamic Pipeline

on: [push]

env:
  CHANGELOG_FILE: CHANGELOG.md
  FULL_CHANGELOG_FILE: FULL_CHANGELOG.md
  README_FILE: README.md
  CONVCO_VERSION: v0.6.1
  UV_VERSION: 0.11.8
  PACKAGE_NAME: "pysparkdt"
  PACKAGE_PATH: "pysparkdt"

jobs:

  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        pyspark-version: ["3.5.5", "4.0.1"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Pin PySpark version
        run: |
          sed -i 's|"pyspark\\[sql\\][^"]*"|"pyspark[sql]==${{ matrix.pyspark-version }}"|' pyproject.toml
          uv lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest tests
